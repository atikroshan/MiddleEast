:root{--sp:10px;--bg:#0b0b0c;--card:#141416;--btn:#1c1c1e;--line:#2b2b2e;--tx:#f5f5f5;--mut:#9a9aa0;--or:#ff9f1c;--g:#2ecc71;--r:#e74c3c}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#050506;color:var(--tx);font-family:MEINR,Roboto,system-ui,-apple-system,Segoe UI,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#app{width:100%;height:100%;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative;padding-top:env(safe-area-inset-top,0px)}
@media(min-width:520px){#app{width:390px;height:min(840px,96vh);border-radius:32px;border:6px solid #2a2a2e;padding-top:0}}

/* ===== Layout (6" screen ≈ Banner 1.25" | Holder 3" | Filters 0.75" | Cart bar 1") ===== */
.banner{flex:0 0 20%;padding:var(--sp) 12px 0;min-height:0}
.banner .bx{width:100%;height:100%;border-radius:16px;border:1px solid var(--line);background:var(--card);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--or);font-weight:800;font-size:20px;text-align:center}
.banner .bx.sk{background:linear-gradient(100deg,#141416 30%,#222226 50%,#141416 70%);background-size:200% 100%;animation:shm 1.2s linear infinite;color:transparent}
@keyframes shm{to{background-position:-200% 0}}
.banner img{width:100%;height:100%;object-fit:contain;display:block}
.filters{flex:none;display:flex;flex-direction:column;gap:var(--sp);padding-top:var(--sp)}
#slider{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
#slider::-webkit-scrollbar{display:none}
.bar{flex:0 0 14%;min-height:78px;display:flex;justify-content:space-between;align-items:center;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));background:#101012;border-top:1px solid var(--line)}

.ic,.vb{width:18px;height:18px;border:2px solid;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;flex:none;background:rgba(0,0,0,.5)}
.ic.v,.vb.v{border-color:#2ecc71}
.ic.v::after,.vb.v::after{content:'';width:8px;height:8px;background:#2ecc71;border-radius:50%;display:block}
.ic.n,.vb.n{border-color:#e74c3c}
.ic.n::after,.vb.n::after{content:'';border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:9px solid #e74c3c;display:block}

.row{display:flex;gap:8px;padding:0 12px}
.tg{flex:1;height:36px;border-radius:11px;background:var(--btn);border:1.5px solid var(--line);color:var(--tx);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.tg.on.veg{border-color:var(--g);background:#11241a}.tg.on.nv{border-color:var(--r);background:#2a1412}
.chips{display:flex;gap:7px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 15px;border-radius:10px;background:var(--btn);border:1.5px solid var(--line);color:var(--tx);font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;display:flex;align-items:center}
.chip.on{background:var(--or);color:#1a1200;border-color:var(--or);box-shadow:0 0 14px #ff9f1c55}

.slide{flex:0 0 100%;scroll-snap-align:center;padding:var(--sp) 12px var(--sp);display:flex}
.card{flex:1;border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-height:0;background:var(--card)}
.img{flex:1;min-height:0;position:relative;background:radial-gradient(circle at 50% 55%,#5b3a14,#1c1208 80%);display:flex;align-items:center;justify-content:center;font-size:64px}
.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:12px;left:12px;z-index:2;font-size:11px;font-weight:700;color:var(--or);border:1px solid var(--or);border-radius:8px;padding:5px 9px;background:#000a}
.vb{position:absolute;top:12px;right:12px;z-index:2}
.ar{position:absolute;z-index:2;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:1px solid #444;background:#000b;color:var(--tx);font-size:20px;line-height:1;cursor:pointer}
.ar.l{left:8px}.ar.r{right:8px}
.info{padding:8px 14px 10px;flex:none;background:var(--card)}
.nm{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nm h3{font-size:16px;font-weight:700;flex:1;min-width:0}
.bd{flex:none;font-size:10px;font-weight:700;color:var(--or);border:1px solid #7a4d0a;background:#2a1b06;border-radius:8px;padding:6px 9px}
.info p{font-size:11px;color:var(--mut);margin-top:3px;min-height:14px}
.buy{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.buy small{font-size:10px;color:var(--mut);display:block;font-weight:700;letter-spacing:.4px}
.price{font-size:21px;font-weight:800;color:var(--or)}

/* bigger + / - */
.qty{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#0e0e10;border:1.5px solid var(--line);border-radius:34px;padding:4px;width:132px}
.qty b{font-size:16px;font-weight:800;color:var(--or);min-width:22px;text-align:center}
.qb{width:40px;height:40px;border-radius:50%;border:0;font-size:24px;font-weight:800;cursor:pointer;background:#252528;color:#c0c0c5;display:flex;align-items:center;justify-content:center;transition:all .2s ease;line-height:1}
.qb:active{transform:scale(.92)}
.qb:disabled{opacity:.3;cursor:not-allowed;background:#1c1c1e;color:#555}
.qb.p{background:var(--or);color:#000}
.empty{margin:auto;color:var(--mut);padding:20px;text-align:center}

.bar small{font-size:11px;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:8px}
.bar small em{font-style:normal;background:#26262a;color:var(--mut);border-radius:6px;padding:3px 7px;font-size:9px}
.bar .t{font-size:24px;font-weight:800;margin-top:3px}
.vc{background:var(--btn);border:1.5px solid var(--line);color:var(--tx);font-weight:700;padding:0 18px;height:48px;border-radius:14px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:9px}
.vc svg{width:20px;height:20px;fill:none;stroke:var(--or);stroke-width:2}
.vc.on{background:var(--or);border-color:var(--or);color:#000}.vc.on svg{stroke:#fff}

.sheet{position:absolute;inset:0;background:#000a;display:none;align-items:flex-end;z-index:9}
.sheet.open{display:flex}
.panel{background:#151518;width:100%;max-height:calc(100% - 8px);border-radius:22px 22px 0 0;padding:12px 14px max(12px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;min-height:0}
.panel h2{font-size:18px;display:flex;justify-content:space-between;margin-bottom:6px;flex:none}
.list{overflow-y:auto;margin:6px 0;flex:1;min-height:0}
.li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;gap:8px}
.li span{color:var(--mut);font-size:12px;display:block}
.ok{background:var(--or);color:#1a1200;border:0;border-radius:14px;padding:14px;font-weight:800;font-size:15px;cursor:pointer}
.ok:disabled{opacity:.4;cursor:not-allowed}
.x{background:none;border:0;color:var(--tx);font-size:22px;cursor:pointer}
.seg{display:flex;gap:6px;margin-bottom:8px;flex:none}
.seg button{flex:1;min-width:0;padding:7px 3px;border-radius:14px;background:var(--btn);border:1.5px solid var(--line);color:var(--tx);font-weight:700;font-size:11px;line-height:1.1;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.seg button.on{border-color:var(--or);background:#2a1b06;color:var(--or)}
.tbl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tbl button{padding:8px 5px;border-radius:12px;background:var(--btn);border:1.5px solid var(--line);color:var(--tx);font-weight:700;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px}
.tbl .on{border-color:var(--or);background:#2a1b06;color:var(--or)}
.seg svg,.tbl svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.seg svg{width:26px;height:26px}
.seg button.delivery svg{width:32px;height:32px;stroke-width:1.4}
.seg button.delivery span{white-space:nowrap}
.panel.dv{padding:20px 18px max(18px,env(safe-area-inset-bottom,0px));overflow-y:auto}
.panel.dv h2{margin-bottom:12px}
.panel.dv .list{flex:none;max-height:150px;margin:4px 0 16px}
.panel.dv .seg{gap:10px;margin-bottom:18px}
.dform{border-top:1px solid var(--line);padding-top:16px;margin-bottom:6px}
.dh{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);margin-bottom:12px}
.panel.dv input{margin-bottom:14px}
.panel.dv .err{margin:-8px 0 12px 4px}
.panel.dv .ok{margin-top:6px;flex:none}
.err{color:#ff6b5e;font-size:12px;margin:-6px 0 8px 4px;display:none}
.panel input.bad{border-color:#e74c3c}
.panel input{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#0e0e10;color:var(--tx);margin-bottom:10px;font-size:14px}
.sheet.ctr{align-items:center;padding:14px}.sheet.ctr .panel{border-radius:22px;height:30%;min-height:230px;justify-content:center;padding:22px 20px}

.pv{width:100%;display:block;border-radius:12px;border:1px solid var(--line)}
.hint{flex:none;font-size:12px;color:var(--mut);text-align:center;margin:4px 0 10px;line-height:1.4}
.hint b{color:var(--or)}
.ok.sec{background:var(--btn);color:var(--tx);border:1.5px solid var(--line)}
/* progress */
.pg{padding:6px 4px;text-align:center}
.pg .big{font-size:28px;font-weight:800;margin-bottom:22px}
.prog{height:14px;background:#26262a;border-radius:8px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9f1c,#ffd27a);border-radius:8px;transition:width .45s ease}
.pg .pt{margin-top:16px;font-size:15px;color:var(--or);min-height:18px}
.stk{display:flex;flex-direction:column;gap:7px;flex:none}
.stk a{display:block;text-align:center;text-decoration:none;padding:14px;border-radius:12px;font-weight:800;font-size:15px}
.wab{background:#25d366;color:#04210f}

/* ===== Admin ===== */
.banner{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.sheet.lg{align-items:center;padding:16px;z-index:30}
.sheet.lg .panel{border-radius:22px;padding:20px 18px}
.sheet.lg .panel h2{margin-bottom:14px}
.sheet.lg .panel input{margin-bottom:12px}
.sheet.lg .err{margin:-4px 0 10px 4px}
.adm{position:absolute;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.adm.open{display:flex}
.ah{flex:none;display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--line)}
.ah h2{flex:1;font-size:19px}
.ah h2 small{font-size:12px;color:var(--mut);font-weight:600;margin-left:6px}
.ah button{background:var(--btn);border:1.5px solid var(--line);color:var(--tx);border-radius:10px;height:38px;min-width:38px;padding:0 12px;font-size:15px;font-weight:700;cursor:pointer}
.al{flex:1;overflow-y:auto;min-height:0}
.ahd,.ar2{display:grid;grid-template-columns:42% 1fr;gap:12px;padding:0 14px}
.ahd{padding-top:10px;padding-bottom:6px;font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.6px;text-transform:uppercase}
.ar2{align-items:center;padding-top:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.ar2 .on2{font-size:20px;font-weight:800;color:var(--or)}

/* ================= MENU ================= */

const categories = ["All", "Pizza", "Burger", "Sides", "Beverages"];
let selectedCat = "All", filterVeg = false, filterNv = false, cart = {};

/* ================= LOCAL IMAGES (Banner/ & Holder/) ================= */
const EXTS = [".jpg",".jpeg",".png",".webp",".JPG",".JPEG",".PNG",".WEBP"];
function candidates(dir, file){
  const base = file.replace(/\.[^.]+$/, "");
  const list = [file, ...EXTS.map(e => base + e)];
  return [...new Set(list)].map(f => dir + encodeURIComponent(f).replace(/%2F/g,"/"));
}
function nextImg(el){
  const c = JSON.parse(el.dataset.c), i = (+el.dataset.i || 0) + 1;
  if(i < c.length){ el.dataset.i = i; el.src = c[i]; }
  else { el.onerror = null; el.style.display = "none"; }
}
function imgTag(dir, file, alt, eager){
  const c = candidates(dir, file);
  return `<img ${eager ? 'fetchpriority="high"' : 'loading="lazy"'} decoding="async" src="${c[0]}" alt="${alt}" data-c='${JSON.stringify(c)}' data-i="0" onerror="nextImg(this)">`;
}
function loadBanner(){
  const c = candidates(BANNER_DIR, BANNER_FILE), box = $("bnr");
  const im = new Image();
  im.alt = "Middle East Banner"; im.fetchPriority = "high"; im.decoding = "async";
  im.dataset.c = JSON.stringify(c); im.dataset.i = "0";
  im.onerror = () => nextImg(im);
  im.onload = () => { box.classList.remove("sk"); box.innerHTML = ""; box.appendChild(im); };
  im.src = c[0];
  window.bannerEl = im;
  setTimeout(() => { if(!im.complete || !im.naturalWidth) box.classList.remove("sk"); }, 6000);
}

/* ================= MENU UI ================= */
function init(){ loadBanner(); renderCategories(); renderMenu(); totals();
  try{ fetch(APPS_SCRIPT_URL + "?action=ping").catch(()=>{}); }catch(e){}   // Apps Script ko pehle se jaga deta hai
  setInterval(() => { if(!document.hidden) fetch(APPS_SCRIPT_URL + "?action=ping").catch(()=>{}); }, 240000);
}

function renderCategories(){
  $("chips").innerHTML = categories.map(c => `<div class="chip ${c===selectedCat?'on':''}" onclick="selectCategory('${c}')">${c}</div>`).join("");
}
function selectCategory(c){ selectedCat = c; renderCategories(); renderMenu(); $("slider").scrollLeft = 0; }
function toggleVeg(){
  filterVeg = !filterVeg; if(filterVeg) filterNv = false;
  $("tgVeg").classList.toggle("on", filterVeg); $("tgNv").classList.remove("on"); renderMenu();
}
function toggleNv(){
  filterNv = !filterNv; if(filterNv) filterVeg = false;
  $("tgNv").classList.toggle("on", filterNv); $("tgVeg").classList.remove("on"); renderMenu();
}
function renderMenu(){
  const slider = $("slider");
  const keep = slider.scrollLeft;
  const f = menuData.filter(i => {
    if(selectedCat !== "All" && i.category !== selectedCat) return false;
    if(filterVeg && !i.isVeg) return false;
    if(filterNv && i.isVeg) return false;
    return true;
  });
  if(!f.length){ slider.innerHTML = `<div class="empty">No items available</div>`; return; }
  slider.innerHTML = f.map((it, idx) => {
    const q = cart[it.id] || 0;
    return `<div class="slide"><div class="card">
      <div class="img">
        ${imgTag(HOLDER_DIR, it.img, it.name, idx<2)}
        <span class="tag">${it.tag}</span><span class="vb ${it.isVeg?'v':'n'}"></span>
        ${idx>0?`<button class="ar l" onclick="scrollSlider(-1)">‹</button>`:""}
        ${idx<f.length-1?`<button class="ar r" onclick="scrollSlider(1)">›</button>`:""}
      </div>
      <div class="info">
        <div class="nm"><h3>${it.name}</h3><span class="bd">${it.category}</span></div>
        <p>${it.desc}</p>
        <div class="buy">
          <div><small>PRICE</small><div class="price">₹${it.price}/-</div></div>
          <div class="qty">
            <button class="qb" onclick="updateQty(${it.id},-1)" ${q===0?"disabled":""}>−</button>
            <b>${q}</b>
            <button class="qb p" onclick="updateQty(${it.id},1)">+</button>
          </div>
        </div>
      </div></div></div>`;
  }).join("");
  slider.scrollLeft = keep;
}
function scrollSlider(d){ const s = $("slider"); s.scrollBy({left: d*s.clientWidth, behavior:"smooth"}); }
function updateQty(id, ch){
  if(busy) return;
  cart[id] = (cart[id]||0) + ch;
  if(cart[id] <= 0) delete cart[id];
  renderMenu(); totals();
}
function totals(){
  let t=0, n=0;
  for(const k in cart){ const i = menuData.find(x => x.id==k); if(i){ t += i.price*cart[k]; n += cart[k]; } }
  $("cartTotal").textContent = t; $("cartCount").textContent = n;
  $("vcBtn").classList.toggle("on", n>0);
  return t;
}

/* ================= CART / CHECKOUT ================= */
let step="cart", mode=null, tbl=null, oth="", dname="", daddr="", dpin="", dcontact="";
let ord="", snap=null, pic="", picBlob=null, savePromise=null, busy=false, waLink="", pct=0, ptxt="";

const S = d => `<svg viewBox="0 0 24 24">${d}</svg>`;
const IC = {
  sit:S('<path d="M7 3v7M4.5 3v5a2.5 2.5 0 0 0 5 0V3M7 10v11M17 21V3c-2.5 1.5-3 5-3 8h3"/>'),
  pick:S('<path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/>'),
  delivery:S('<circle cx="5" cy="16.7" r="3.3"/><circle cx="19" cy="16.7" r="3.3"/><path d="M2.8 11H8.5"/><path d="M8.5 11.2C9 8.8 12.8 8.6 14.6 10.4L15.4 11.2Z"/><rect x="9.5" y="12.8" width="5" height="3.6" rx=".8"/><path d="M5 16.7H9.5M14.5 16.4H19M19 16.7L16.6 8.4M15 7.8H18"/><circle cx="17.5" cy="10.8" r="1.1" style="fill:currentColor;stroke:none"/>'),
  tbl:S('<path d="M3 9h18M6 9v10M18 9v10M8 9V6h8v3"/>'),
  oth:S('<circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/>')
};
const rows = () => Object.keys(cart).map(k => { const i = menuData.find(x => x.id==k); return i ? {id:i.id,n:i.name,q:cart[k],p:i.price} : null; }).filter(Boolean);
const where = () => mode=="sit" ? "Sit-n-Eat · " + (tbl=="Other" ? (oth||"Other") : tbl) : mode=="delivery" ? "Online Delivery" : "Pick-n-Carry";
const deliveryOK = () => dname.trim() && daddr.trim() && /^\d{6}$/.test(dpin.trim()) && /^\d{10}$/.test(dcontact.trim());

function showCart(){
  if(busy || !Object.keys(cart).length) return;
  step="cart"; render(); $("sheet").classList.add("open");
}

function render(){
  const P = $("panel"), r = rows(), t = totals();
  $("sheet").classList.toggle("ctr", step=="done");
  let h = "";
  if(step=="cart"){
    h = `<h2>Your Cart <button class="x" data-a="close">✕</button></h2><div class="list">`;
    h += r.length
      ? r.map(x => `<div class="li"><div>${x.n}<span>₹${x.p} × ${x.q} = ₹${x.p*x.q}</span></div>
          <div class="qty"><button class="qb" data-m="${x.id}">−</button><b>${x.q}</b><button class="qb p" data-p="${x.id}">+</button></div></div>`).join("")
        + `<div class="li"><b>Total Amount</b><b style="color:var(--or)">₹${t}/-</b></div>`
      : `<div class="empty">Your cart is empty</div>`;
    h += "</div>";
    if(r.length){
      h += `<div class="seg">
        <button class="${mode=="sit"?"on":""}" data-a="mode" data-v="sit">${IC.sit}Sit-n-Eat</button>
        <button class="${mode=="pick"?"on":""}" data-a="mode" data-v="pick">${IC.pick}Pick-n-Carry</button>
        <button class="delivery ${mode=="delivery"?"on":""}" data-a="mode" data-v="delivery">${IC.delivery}<span>Online Delivery</span></button></div>`;
      if(mode=="sit"){
        h += '<div class="tbl">' + ["Table 1","Table 2","Table 3","Table 4","Table 5","Other"]
          .map(x => `<button class="${tbl==x?"on":""}" data-a="tbl" data-v="${x}">${x=="Other"?IC.oth:IC.tbl}${x}</button>`).join("") + "</div>";
        if(tbl=="Other") h += '<input id="oth" placeholder="Table / location details">';
      }
      if(mode=="delivery"){
        h += '<div class="dform"><div class="dh">Delivery Details</div>'
          + '<input id="dname" placeholder="Name *" autocomplete="name">'
          + '<input id="daddr" placeholder="Address *" autocomplete="street-address">'
          + '<input id="dpin" placeholder="Pincode * (6 digits)" inputmode="numeric" maxlength="6" autocomplete="postal-code">'
          + '<div class="err" id="epin">Pincode exactly 6 digits ka hona chahiye</div>'
          + '<input id="dcontact" placeholder="Mobile number * (10 digits)" inputmode="numeric" maxlength="10" autocomplete="tel-national">'
          + '<div class="err" id="econtact">Mobile number exactly 10 digits ka hona chahiye</div></div>';
      }
      h += `<button class="ok" data-a="next" ${mode && (mode=="pick" || (mode=="sit" && tbl) || (mode=="delivery" && deliveryOK())) ? "" : "disabled"}>Confirm Order</button>`;
    }
  }else if(step=="preview"){
    h = `<h2>Confirm Your Order <button class="x" data-a="close">✕</button></h2>
      <div class="list"><img class="pv" src="${pic}" alt="Your bill"></div>
      <div class="hint">Tap <b>Book Order</b>: WhatsApp will open with this bill attached. Just tap Send.</div>
      <div class="stk"><button class="ok" data-a="book">Book Order</button><button class="ok sec" data-a="edit">Edit Order</button></div>`;
  }else{
    h = `<h2><span>${ord ? "Order " + ord : "Placing Order"}</span>${waLink ? `<button class="x" data-a="closeord">✕</button>` : ""}</h2>
      <div class="pg">
        <div class="big" id="pbig">${waLink ? "Order ready ✓" : "Please wait…"}</div>
        <div class="prog"><i id="pbar" style="width:${pct}%"></i></div>
        <div class="pt" id="ptxt">${waLink ? "WhatsApp is opening. If it does not open, tap the button below." : ptxt}</div>
      </div>
      <div class="stk">${waLink ? `<a class="wab" href="${waLink}" target="_blank" rel="noopener" onclick="setTimeout(reset,500)">Open WhatsApp</a>` : ""}</div>`;
  }
  P.innerHTML = h;
  P.classList.toggle("dv", step=="cart" && mode=="delivery");

  const o = $("oth"); if(o){ o.value = oth; o.oninput = () => oth = o.value; }
  const dn=$("dname"), da=$("daddr"), dp=$("dpin"), dc=$("dcontact");
  if(dn){
    dn.value=dname; da.value=daddr; dp.value=dpin; dc.value=dcontact;
    const upd = () => {
      dname=dn.value; daddr=da.value; dpin=dp.value; dcontact=dc.value;
      const b = P.querySelector('[data-a="next"]'); if(b) b.disabled = !deliveryOK();
      const chk = (el,er,n) => { const e=$(er); const bad = el.value.length>0 && el.value.length!==n; e.style.display = bad?"block":"none"; el.classList.toggle("bad", bad); };
      chk(dp,"epin",6); chk(dc,"econtact",10);
    };
    [dp,dc].forEach(e => e.addEventListener("input", () => { const c=e.value.replace(/\D/g,""); if(c!==e.value) e.value=c; }));
    [dn,da,dp,dc].forEach(e => e.addEventListener("input", upd));
    upd();
  }
}

function setProg(p, txt){
  pct = p; ptxt = txt;
  const b=$("pbar"), t=$("ptxt");
  if(b) b.style.width = p + "%";
  if(t) t.textContent = txt;
}

/* ================= BILL IMAGE (canvas) ================= */
const rsw = size => size*0.66;
function drawRupee(x,left,base,size,col){
  const h=size*0.72, top=base-h, w=size*0.5;
  x.save(); x.strokeStyle=col; x.lineWidth=size*0.085; x.lineCap="butt"; x.lineJoin="miter";
  x.beginPath();
  x.moveTo(left,top); x.lineTo(left+w,top);
  x.moveTo(left,top+h*0.24); x.lineTo(left+w,top+h*0.24);
  x.moveTo(left+w*0.30,top); x.lineTo(left+w*0.45,top);
  x.bezierCurveTo(left+w*0.98,top,left+w*0.98,top+h*0.52,left+w*0.45,top+h*0.52);
  x.lineTo(left,top+h*0.52);
  x.moveTo(left+w*0.18,top+h*0.46); x.lineTo(left+w*0.95,top+h);
  x.stroke(); x.restore();
}
function rs(x,txt,p,size,col,al){
  x.font="bold "+size+"px MEINR,sans-serif"; x.fillStyle=col; x.textAlign="left";
  const sw=rsw(size), tw=x.measureText(txt).width;
  const left = al=="right" ? p.x-(sw+tw) : p.x;
  drawRupee(x,left,p.y,size,col); x.fillText(txt,left+sw,p.y);
}
function rr(x,X,Y,W,H,R){
  x.beginPath();x.moveTo(X+R,Y);x.arcTo(X+W,Y,X+W,Y+H,R);x.arcTo(X+W,Y+H,X,Y+H,R);x.arcTo(X,Y+H,X,Y,R);x.arcTo(X,Y,X+W,Y,R);x.closePath();
}
function wrap(x,t,mw){
  const o=[]; let l="";
  for(const w of t.split(" ")){ const n = l ? l+" "+w : w; if(x.measureText(n).width>mw && l){ o.push(l); l=w; } else l=n; }
  if(l) o.push(l); return o;
}
function draw(r,t,w,useBanner){
  const W=640,P=24,IW=W-2*P,LH=38,IS=30,NOTE="You will receive it within 15 Minutes of placing the order.";
  const c=document.createElement("canvas"), x=c.getContext("2d");
  const items = r.map(a => {
    const p=String(a.q*a.p);
    x.font="bold "+IS+"px MEINR,sans-serif";
    const pw = x.measureText(p).width + rsw(IS);
    return {p, pw, l:wrap(x, a.q+" × "+a.n, IW-pw-20)};
  });
  let y=282;
  const pos = items.map(it => { const p=y; y += it.l.length*LH+12; return p; });
  const divY=y-24, totY=divY+58;
  let nf=26; x.font="bold "+nf+"px sans-serif";
  while(x.measureText(NOTE).width>W-32 && nf>10){ nf--; x.font="bold "+nf+"px sans-serif"; }
  let bi=null, BH=0;
  if(useBanner){
    const el=window.bannerEl;
    if(el && el.complete && el.naturalWidth>0){ bi=el; BH=Math.round(IW*el.naturalHeight/el.naturalWidth); }
  }
  const sh = bi ? BH-32 : 0;
  const noteY=totY+46, H=noteY+34+sh;
  c.width=W; c.height=H;
  x.fillStyle="#141416"; x.fillRect(0,0,W,H);
  x.textBaseline="alphabetic"; x.textAlign="left";
  if(bi){
    x.save(); rr(x,P,16,IW,BH,16); x.clip(); x.drawImage(bi,P,16,IW,BH); x.restore();
    x.translate(0,sh);
  }else{
    x.fillStyle="#ff9f1c"; x.font="bold 28px sans-serif"; x.fillText("Middle East Pizza & Fast Food",P,46);
  }
  x.fillStyle="#fff"; x.font="bold 36px sans-serif"; x.fillText("Order "+ord,P,98);
  let fs=32; x.font="bold "+fs+"px sans-serif";
  while(x.measureText(w).width>IW-44 && fs>16){ fs--; x.font="bold "+fs+"px sans-serif"; }
  const pw=x.measureText(w).width+44, px=(W-pw)/2;
  rr(x,px,118,pw,58,29); x.fillStyle="#ff9f1c22"; x.fill(); x.strokeStyle="#ff9f1c"; x.lineWidth=2.5; x.stroke();
  x.fillStyle="#ff9f1c"; x.textAlign="center"; x.textBaseline="middle"; x.fillText(w,W/2,148);
  x.textBaseline="alphabetic"; x.font="24px sans-serif"; x.fillStyle="#cfcfcf"; x.fillText(new Date().toLocaleString("en-IN"),W/2,214);
  x.strokeStyle="#444"; x.lineWidth=1.5; x.beginPath(); x.moveTo(P,240); x.lineTo(W-P,240); x.stroke();
  items.forEach((it,k) => {
    x.font="bold "+IS+"px sans-serif"; x.textAlign="left"; x.fillStyle="#fff";
    it.l.forEach((ln,j) => x.fillText(ln,P,pos[k]+j*LH));
    rs(x,it.p,{x:W-P,y:pos[k]},IS,"#fff","right");
  });
  x.strokeStyle="#444"; x.lineWidth=1.5; x.beginPath(); x.moveTo(P,divY); x.lineTo(W-P,divY); x.stroke();
  x.fillStyle="#ff9f1c"; x.font="bold 42px sans-serif"; x.textAlign="left"; x.fillText("Total",P,totY);
  rs(x,t+"/-",{x:W-P,y:totY},42,"#ff9f1c","right");
  x.fillStyle="#ff9f1c"; x.font="bold "+nf+"px sans-serif"; x.textAlign="center"; x.textBaseline="middle"; x.fillText(NOTE,W/2,noteY);
  return c;
}

/* ================= BOOK ORDER FLOW ================= */
let leftApp=false;
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ if(waLink) leftApp=true; }
  else if(leftApp){ leftApp=false; reset(); }
});
function openWa(url){
  const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const app=url.replace("https://wa.me/","whatsapp://send?phone=").replace("?text=","&text=");
  waLink = mobile ? app : url;
  setProg(100,"Opening WhatsApp…"); render();
  setTimeout(()=>{ window.location.href = waLink; },350);
}

async function jget(url){ const r = await fetch(url); return r.json(); }

function buildMsg(link){
  const s=snap;
  let m = `*New Order — ${ord}*\n`;
  m += `━━━━━━━━━━━━━━\n`;
  m += `📌 *Order Type:* ${s.w}\n`;
  if(s.dname){
    m += `👤 *Name:* ${s.dname}\n📞 *Phone:* ${s.dcontact}\n📍 *Address:* ${s.daddr} (Pin: ${s.dpin})\n`;
  }
  m += `━━━━━━━━━━━━━━\n🍽️ *ITEMS:*\n`;
  s.r.forEach((it,i) => { m += `${i+1}. ${it.n} (${it.q} × ₹${it.p} = ₹${it.q*it.p})\n`; });
  m += `━━━━━━━━━━━━━━\n💰 *TOTAL: ₹${s.t}/-*\n🕒 ${new Date().toLocaleString("en-IN")}\n`;
  if(link) m += `\n🧾 *Order Details:*\n${link}\n`;
  m += `\n_Please confirm my order._`;
  return m;
}

// STEP 1: Confirm Order -> order number + bill image banti hai, preview dikhta hai (abhi kuch save/send nahi hota)
async function confirmOrder(){
  if(busy) return;
  busy = true; pct = 0; ptxt = ""; step = "done"; render();
  const r = rows(), t = totals(), w = where();
  snap = {r,t,w,dname,daddr,dpin,dcontact};

  if(!ord){   // edit karke dobara confirm kare to wahi order number rehta hai
    setProg(15,"Generating your order number…");
    try{
      const d = await jget(APPS_SCRIPT_URL + "?action=reserve");
      ord = (d && d.ordNumber) ? d.ordNumber : "";
    }catch(e){}
    if(!ord) ord = "ME-" + String(Date.now()).slice(-4);
    render();
  }

  setProg(55,"Preparing your bill…");
  try{ await document.fonts.load("bold 30px MEINR","₹"); }catch(e){}
  let c;
  try{ c = draw(r,t,w,true); pic = c.toDataURL("image/png"); }
  catch(e){ c = draw(r,t,w,false); pic = c.toDataURL("image/png"); } // file:// me banner canvas ko block karta hai
  picBlob = await new Promise(res => c.toBlob(res,"image/png"));

  savePromise = null;
  busy = false; step = "preview"; render();
}

// Drive + Sheet me save (Book Order dabate hi background me start hota hai)
function saveOrder(){
  if(savePromise) return savePromise;
  const s = snap, p = pic, o = ord;
  savePromise = (async () => {
    try{
      const res = await fetch(APPS_SCRIPT_URL, {
        method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
        body: JSON.stringify({
          action:"save", ordNumber:o, image:p,
          summary: s.w + (s.dname ? " | " + s.dname + " | " + s.dcontact + " | " + s.daddr + " (" + s.dpin + ")" : "") + " | Total ₹" + s.t
        })
      });
      const d = await res.json();
      if(d && d.status==="success") return d.url;
    }catch(e){}
    savePromise = null;      // fail hua to dobara try ho sakta hai
    return "";
  })();
  return savePromise;
}

// STEP 2: Book Order -> bill image WhatsApp me attach (customer sirf Send dabata hai)
function placeOrder(){
  if(busy || !picBlob) return;
  const text = buildMsg("");
  const file = new File([picBlob], ord + ".png", {type:"image/png"});
  const up = saveOrder();   // click ke saath hi save shuru
  let canShare = false;
  try{ canShare = !!(navigator.share && navigator.canShare && navigator.canShare({files:[file]})); }catch(e){}
  if(!canShare){ fallbackWa(up,text); return; }
  busy = true;
  navigator.share({files:[file], text})
    .then(async () => {
      step="done"; waLink=""; setProg(90,"Finishing…"); render();
      await up; reset();
    })
    .catch(e => {
      busy = false;
      if(!(e && e.name==="AbortError")) fallbackWa(up,text);   // customer ne cancel kiya to preview par hi rahega
    });
}

// Agar phone/browser image share support na kare (jaise desktop): sirf text WhatsApp me khulta hai
async function fallbackWa(up,text){
  busy = true; step = "done"; waLink = ""; pct = 40; ptxt = "Processing your order…"; render();
  await up;
  openWa(`https://wa.me/${NO}?text=` + encodeURIComponent(text));
}

function reset(){
  cart={}; totals(); renderMenu();
  mode=null; tbl=null; oth=""; dname=""; daddr=""; dpin=""; dcontact="";
  busy=false; step="cart"; waLink=""; ord=""; pct=0; leftApp=false; pic=""; picBlob=null; savePromise=null;
  $("sheet").classList.remove("open");
}

function act(a,v){
  if(a=="close") $("sheet").classList.remove("open");
  else if(a=="mode"){ mode=v; if(v=="pick") tbl=null; render(); }
  else if(a=="tbl"){ tbl=v; render(); }
  else if(a=="next"){
    if(busy) return;
    if(mode=="delivery" && !deliveryOK()) return;
    confirmOrder();
  }
  else if(a=="book") placeOrder();
  else if(a=="edit"){ step="cart"; render(); }
  else if(a=="closeord") reset();
}

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if(!t) return;
  if(busy && (t.dataset.m || t.dataset.p)) return;
  if(t.dataset.m){ updateQty(+t.dataset.m,-1); render(); return; }
  if(t.dataset.p){ updateQty(+t.dataset.p,1); render(); return; }
  if(t.dataset.a){ act(t.dataset.a,t.dataset.v); }
});
/* ================= ADMIN (banner par double tap) ================= */
let adminU="", adminP="", adminList=[];
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const thumb = (id,w) => "https://lh3.googleusercontent.com/d/" + id + "=w" + w;
const thumbAlt = (id,w) => "https://drive.google.com/thumbnail?id=" + id + "&sz=w" + w;
function imgErr(el,id,w){ el.onerror=null; el.src=thumbAlt(id,w); }

(function(){
  let last=0;
  document.querySelector(".banner").addEventListener("click", () => {
    const n=Date.now();
    if(n-last<450){ last=0; openAdminLogin(); } else last=n;
  });
})();

async function apost(obj){
  const r = await fetch(APPS_SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(obj)});
  return r.json();
}

function openAdminLogin(){
  if(busy) return;
  const el=$("adminLogin");
  el.innerHTML = `<div class="panel"><h2>Admin Login <button class="x" id="alx">✕</button></h2>
    <input id="au" placeholder="Admin ID" autocomplete="off" autocapitalize="off" spellcheck="false">
    <input id="ap" type="password" placeholder="Password" autocomplete="off">
    <div class="err" id="aerr"></div>
    <button class="ok" id="alg">Login</button></div>`;
  el.classList.add("open");
  $("alx").onclick = () => el.classList.remove("open");
  $("alg").onclick = adminLogin;
  [$("au"),$("ap")].forEach(i => i.addEventListener("keydown", e => { if(e.key==="Enter") adminLogin(); }));
  setTimeout(()=>$("au").focus(),50);
}

async function adminLogin(){
  const u=$("au").value.trim(), p=$("ap").value, err=$("aerr"), btn=$("alg");
  err.style.display="none";
  if(!u||!p){ err.textContent="Enter ID and password"; err.style.display="block"; return; }
  btn.disabled=true; btn.textContent="Checking…";
  try{
    const d = await apost({action:"orders",user:u,pass:p});
    if(d && d.status==="success"){
      adminU=u; adminP=p; adminList=d.orders||[];
      $("adminLogin").classList.remove("open"); $("adminLogin").innerHTML="";
      showAdmin();
      return;
    }
    err.textContent="Wrong ID or password";
  }catch(e){ err.textContent="Network error. Please try again."; }
  err.style.display="block"; btn.disabled=false; btn.textContent="Login";
}

function showAdmin(){
  const a=$("adm");
  a.innerHTML = `<div class="ah"><h2>Orders<small>${adminList.length}</small></h2>
      <button id="arf" title="Refresh">↻</button><button id="acl">✕</button></div>
    <div class="al">
      <div class="ahd"><span>Order No.</span><span>Bill</span></div>
      ${adminList.length ? adminList.map((o,i) => `
        <div class="ar2">
          <div><div class="on2">${esc(o.ord.replace(/^#/,""))}</div><div class="tm">${esc(o.time)}</div><div class="sm">${esc(o.summary)}</div></div>
          <button class="th" data-i="${i}"><img loading="lazy" src="${thumb(o.id,300)}" onerror="imgErr(this,'${o.id}',300)" alt="${esc(o.ord)}"></button>
        </div>`).join("") : `<div class="empty">No orders yet</div>`}
    </div>`;
  a.classList.add("open");
  $("acl").onclick = closeAdmin;
  $("arf").onclick = refreshAdmin;
  a.querySelectorAll(".th").forEach(b => b.onclick = () => openBill(adminList[+b.dataset.i]));
}

async function refreshAdmin(){
  const b=$("arf"); b.textContent="…";
  try{
    const d = await apost({action:"orders",user:adminU,pass:adminP});
    if(d && d.status==="success"){ adminList=d.orders||[]; showAdmin(); return; }
  }catch(e){}
  b.textContent="↻";
}

function closeAdmin(){
  adminU=""; adminP=""; adminList=[];
  $("adm").classList.remove("open"); $("adm").innerHTML="";
  $("adminView").classList.remove("open"); $("adminView").innerHTML="";
}

function openBill(o){
  const v=$("adminView");
  v.innerHTML = `<button class="vc2" id="avx">✕</button><div class="vbox"><img src="${thumb(o.id,1200)}" onerror="imgErr(this,'${o.id}',1200)" alt="${esc(o.ord)}"></div>`;
  v.classList.add("open");
  const close = () => { v.classList.remove("open"); v.innerHTML=""; };
  $("avx").onclick = close;
  v.onclick = e => { if(e.target===v) close(); };
}

$("vcBtn").onclick = showCart;
init();
</script>
